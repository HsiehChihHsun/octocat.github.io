<!DOCTYPE html>
<html lang="zh-TW">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Atom Model Generator</title>
    <link rel="stylesheet" href="style.css">
    <link
        href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;700&family=Roboto:wght@400;700&display=swap"
        rel="stylesheet">
</head>

<body>
    <div class="container">
        <div class="left-panel">
            <div class="controls">
                <div class="control-group">
                    <label for="atomic-number">原子序 (Atomic Number)</label>
                    <select id="atomic-number"></select>
                </div>
                <div class="control-group">
                    <label for="isotope">同位素 (Isotope)</label>
                    <select id="isotope"></select>
                </div>
                <div class="control-group">
                    <label for="charge">帶電量 (Charge)</label>
                    <select id="charge"></select>
                </div>
            </div>

            <div class="element-display">
                <div class="element-name" id="element-name"></div>
                <div class="element-symbol-container">
                    <span class="mass-number" id="mass-number"></span>
                    <span class="atomic-number-display" id="atomic-number-display"></span>
                    <span class="symbol" id="element-symbol"></span>
                </div>
            </div>

            <div class="export-section">
                <!-- Main Atom Export -->
                <button id="export-btn" class="btn">匯出原子模型 (Atom PNG)</button>

                <hr style="margin: 15px 0; border: 0; border-top: 1px solid #eee;">

                <!-- Symbol Features -->
                <button id="export-symbol-btn" class="btn" style="background-color: #28a745;">匯出元素符號 (Symbol
                    PNG)</button>

                <div class="latex-group" style="margin-top: 15px; text-align: left;">
                    <label for="latex-code">LaTeX 複製:</label>
                    <div style="display: flex; gap: 5px;">
                        <input type="text" id="latex-code" readonly
                            style="flex-grow: 1; padding: 5px; font-family: monospace;">
                        <button id="copy-latex-btn" class="btn"
                            style="padding: 5px 10px; font-size: 0.9em; background-color: #6c757d;">複製</button>
                    </div>
                </div>
            </div>
        </div>

        <div class="right-panel">
            <canvas id="atom-canvas"></canvas>
        </div>
    </div>
    <script src="script.js"></script>
</body>

</html>
